{% comment %}
  Usage: {% include image.html src="path/to/image.jpg" alt="Description" %}
  This include optimizes image loading with lazy loading and proper attributes
{% endcomment %}

{% if include.src %}
<img
  src="{{ include.src | relative_url }}"
  alt="{{ include.alt | default: 'Image' | escape }}"
  {% if include.class %}class="{{ include.class }}"{% endif %}
  loading="lazy"
  decoding="async"
  {% if include.width %}width="{{ include.width }}"{% endif %}
  {% if include.height %}height="{{ include.height }}"{% endif %}
>
{% endif %}
